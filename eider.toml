[package]
name = "http"
version = "0.7.3"
eider = "0.7"
description = "HTTP/1.1: a strict incremental parser, a server with deadlines and graceful shutdown, a blocking client, a router, middleware, metrics, problem+json and profiling endpoints (docs/services.md)"

# problem+json bodies and the middleware's JSON (problem.ei, middleware.ei); json is pure,
# so it is granted nothing
[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.7.0"

# the server's and the middleware's log records (server.ei, middleware.ei, trace.ei, service.ei); it writes with io and clock
[deps.logging]
git = "https://github.com/klxdev/eider-logging.git"
version = "0.7.0"
uses = ["io", "clock"]

# Content-Encoding: gzip, deflate and zstd, with hard decompression limits (compress.ei,
# server.ei, client.ei, static.ei); the codecs are pure, but compression.streams (not used here)
# names io and clock, and eider-pkg grants per package, so both are granted
[deps.compression]
git = "https://github.com/klxdev/eider-compression.git"
version = "0.7.0"
uses = ["io", "clock"]

# TLS 1.3 for the server, the client and WebSocket (secure.ei, the only module that imports it). A release of eider-tls whose
# own crypto dependency is the toolchain's (Eider 0.7.6 and later). It reads key and CA files (fs) and drives sockets (net, io,
# clock). Programs that do not import http.secure load none of it and need no grant for it (docs/services.md "TLS").
[deps.tls]
git = "https://github.com/klxdev/eider-tls.git"
version = "0.7.1"
uses = ["net", "io", "clock", "fs"]

# the primitives under eider-tls, the toolchain's own package (Eider 0.7.6 and later ship packages/crypto and its backend);
# it is declared here too so that a git consumer of eider-http needs only an installed toolchain
[deps.crypto]
toolchain = true
uses = ["io"]
